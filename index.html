<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bala Mod Panel</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        /* ফিক্সড লোগো সহ কাস্টম ডায়ালগ */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .custom-modal-card {
            background: #14171d;
            border: 1px solid #232834;
            border-radius: 24px;
            width: 88%;
            max-width: 340px;
            padding: 26px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-fixed-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2.5px solid #ff5500;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101217;
            margin: 0 auto 12px;
        }

        .modal-fixed-logo .r-mid { width:38px; height:38px; border-radius:50%; border:2px solid #ffffff; display:flex; align-items:center; justify-content:center; }
        .modal-fixed-logo .r-in { width:20px; height:20px; border-radius:50%; border:2px solid #ffffff; display:flex; align-items:center; justify-content:center; }
        .modal-fixed-logo .r-dot { width:6px; height:6px; border-radius:50%; background:#ffffff; }

        .modal-title {
            color: #ff5500;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .modal-msg {
            color: #8c96a5;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
            word-break: break-word;
        }

        .modal-btn {
            background: linear-gradient(180deg, #ff6600 0%, #e64d00 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 800;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* ১. লগইন কার্ড */
        .login-card {
            width: 100%;
            max-width: 350px;
            background: #14161c;
            border: 1px solid #1c202a;
            border-radius: 26px;
            padding: 34px 22px 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.4s ease forwards;
        }

        .login-card.hide-anim {
            animation: popOut 0.4s ease forwards;
        }

        .login-title {
            color: #ff5500;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .login-sub {
            color: #6c7584;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            margin-bottom: 22px;
            text-transform: uppercase;
        }

        .login-divider {
            width: 100%;
            height: 1px;
            background-color: #1b1f28;
            margin-bottom: 24px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 22px;
        }

        .input-label {
            color: #5b6474;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-box {
            width: 100%;
            background: #101217;
            border: 1.5px solid #1c212b;
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box:focus {
            border-color: #ff5500;
            box-shadow: 0 0 12px rgba(255, 85, 0, 0.2);
        }

        .input-box::placeholder {
            color: #3b4250;
            font-size: 13px;
        }

        .btn-activate {
            width: 100%;
            background: #ff5500;
            border: none;
            border-radius: 14px;
            padding: 14px;
            color: #000000;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(255, 85, 0, 0.35);
            transition: transform 0.1s ease, filter 0.2s ease;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-activate:active {
            transform: scale(0.98);
            filter: brightness(0.9);
        }

        .info-text {
            color: #606877;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 14px;
        }

        .btn-telegram {
            width: 100%;
            background: #23a0db;
            border: none;
            border-radius: 14px;
            padding: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(35, 160, 219, 0.25);
            transition: transform 0.1s ease;
            margin-bottom: 20px;
        }

        .btn-telegram:active {
            transform: scale(0.98);
        }

        .btn-telegram svg {
            width: 17px;
            height: 17px;
            fill: #ffffff;
        }

        .btn-exit {
            color: #4b5260;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        /* ২. ড্যাশবোর্ড স্ক্রিন */
        .dashboard-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            animation: popIn 0.4s ease forwards;
        }

        .logo-ring {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            border: 3.5px solid #ff5500;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.25);
            margin-bottom: 30px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .logo-ring:active {
            transform: scale(0.95);
        }

        .ring-middle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3.5px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-inner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3.5px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ffffff;
        }

        .dash-title {
            color: #ff5500;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .dash-subtitle-pro {
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .divider-bar {
            width: 90px;
            height: 2.5px;
            background-color: #ff5500;
            border-radius: 2px;
            margin-bottom: 8px;
        }

        .edition-text {
            color: #7a828e;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .version-text {
            color: #434854;
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .expiry-text {
            color: #2ed573;
            font-size: 12px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
        }

        .play-card-btn {
            width: 82px;
            height: 82px;
            background-color: #171920;
            border: 1px solid #232732;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .play-card-btn:active {
            transform: scale(0.92);
        }

        .triangle-icon {
            width: 0;
            height: 0;
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            border-left: 21px solid #ff5500;
            margin-left: 5px;
            transition: all 0.2s ease;
        }

        .play-card-btn.active {
            background-color: #ff5500;
            border-color: #ff7733;
            box-shadow: 0 0 28px rgba(255, 85, 0, 0.5);
        }

        .play-card-btn.active .triangle-icon {
            width: 18px;
            height: 18px;
            border: none;
            background: #ffffff;
            border-radius: 3.5px;
            margin-left: 0;
        }

        .action-label {
            color: #4b5260;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 14px;
            text-transform: uppercase;
        }

        .action-label.active {
            color: #2ed573;
        }

        @keyframes popIn { 0%{opacity:0; transform:scale(0.92) translateY(15px);} 100%{opacity:1; transform:scale(1) translateY(0);} }
        @keyframes popOut { 0%{opacity:1; transform:scale(1) translateY(0);} 100%{opacity:0; transform:scale(0.92) translateY(-15px);} }
    </style>
</head>
<body>

    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal-card">
            <div class="modal-fixed-logo">
                <div class="r-mid"><div class="r-in"><div class="r-dot"></div></div></div>
            </div>
            <div class="modal-title" id="modalTitle">BALA MOD SAFE PRO</div>
            <div class="modal-msg" id="modalMsg">System Details</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- ১. লগইন স্ক্রিন -->
    <div class="login-card" id="loginCard">
        <div class="login-title">BALA MOD V5</div>
        <div class="login-sub">PREMIUM ACTIVATION</div>
        <div class="login-divider"></div>

        <div class="input-group">
            <label class="input-label">ACTIVATION KEY</label>
            <input type="text" class="input-box" id="keyInput" placeholder="Enter activation key" autocomplete="off">
        </div>

        <button class="btn-activate" onclick="handleLogin()">ACTIVATE</button>

        <div class="info-text">Don't have a key yet?</div>

        <a href="https://t.me/your_telegram_id" target="_blank" class="btn-telegram">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
            Contact Developer
        </a>

        <div class="btn-exit" onclick="if(window.Android && window.Android.onExit) window.Android.onExit();">Exit</div>
    </div>

    <!-- ২. ড্যাশবোর্ড স্ক্রিন -->
    <div class="dashboard-container" id="dashContainer">
        <div class="logo-ring" id="logo" onclick="openLogoPopup()">
            <div class="ring-middle">
                <div class="ring-inner">
                    <div class="ring-dot"></div>
                </div>
            </div>
        </div>

        <div class="dash-title">BALA MOD SAFE</div>
        <div class="dash-subtitle-pro">PRO</div>

        <div class="divider-bar"></div>
        <div class="edition-text">Free Fire Edition</div>
        <div class="version-text">v2.0.14</div>

        <div class="expiry-text" id="expiryLabel">Key expires: Calculating...</div>

        <div style="display:flex; flex-direction:column; align-items:center;">
            <div class="play-card-btn" id="mainBtn" onclick="toggleActivation()">
                <div class="triangle-icon" id="playIcon"></div>
            </div>
            <div class="action-label" id="actionText">TAP TO ACTIVATE</div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDrPVWqRp0moKnNJlXlry9-4LX2fzY5vh0",
        databaseURL: "https://bala-mod-1042c-default-rtdb.firebaseio.com",
        projectId: "bala-mod-1042c",
        storageBucket: "bala-mod-1042c.firebasestorage.app",
        messagingSenderId: "584950167269",
        appId: "1:584950167269:android:a0b3f4c7366ab49269860c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getDeviceDetails() {
        const ua = navigator.userAgent;
        let model = "Android Phone";
        let ver = "Android OS";
        const m = ua.match(/Android\s([0-9\.]*)/);
        if(m) ver = "Android " + m[1];
        const bm = ua.match(/;\s([^\;]+)\sBuild/);
        if(bm) model = bm[1];
        return { model, ver };
    }

    let deviceId = localStorage.getItem("b_dev_id") || "DEV-" + Math.random().toString(36).substring(2, 9).toUpperCase();
    localStorage.setItem("b_dev_id", deviceId);

    let targetActionUrl = "";
    let logoCustomPopupText = "Bala Mod Safe Pro is running smoothly and protected.";

    db.ref('actionLink').on('value', s => targetActionUrl = s.val() || "");
    db.ref('logoPopupText').on('value', s => { if(s.val()) logoCustomPopupText = s.val(); });

    db.ref('notifications').limitToLast(1).on('child_added', s => {
        const n = s.val();
        showModal("📢 " + n.title, n.msg);
    });

    function showModal(title, msg) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMsg').innerText = msg;
        document.getElementById('customModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('customModal').style.display = 'none'; }
    function openLogoPopup() { showModal("INFO & STATUS", logoCustomPopupText); }

    function handleLogin() {
        const key = document.getElementById("keyInput").value.trim();
        if(!key) return showModal("WARNING", "Please enter activation key!");

        db.ref('keys/' + key).once('value').then(snap => {
            if(!snap.exists()) return showModal("ERROR", "Invalid or deleted key!");
            const data = snap.val();
            if(data.status === 'freeze') return showModal("LOCKED", "This key has been frozen by Admin!");

            const dev = getDeviceDetails();

            if(data.deviceType === 'single') {
                if(data.registeredDevice && data.registeredDevice !== deviceId) {
                    return showModal("ACCESS DENIED", "This key is bound to another phone!");
                }
                if(!data.registeredDevice) {
                    db.ref('keys/' + key).update({ registeredDevice: deviceId, deviceName: dev.model, androidVer: dev.ver });
                }
            } else {
                db.ref('keys/' + key).update({ registeredDevice: "Multi", deviceName: dev.model, androidVer: dev.ver });
            }

            const now = Date.now();
            let actAt = data.activatedAt || now;
            if(!data.activatedAt) db.ref('keys/' + key).update({ activatedAt: now });

            if(data.durationUnit === 'permanent') {
                openDashboard("Lifetime Permanent Active");
            } else {
                let totalMs = 0;
                if(data.durationUnit === 'minutes') totalMs = data.durationVal * 60 * 1000;
                else if(data.durationUnit === 'hours') totalMs = data.durationVal * 3600 * 1000;
                else if(data.durationUnit === 'days') totalMs = data.durationVal * 86400 * 1000;

                const expireAt = actAt + totalMs;
                if(now >= expireAt) {
                    db.ref('keys/' + key).remove();
                    return showModal("EXPIRED", "Key validity has expired!");
                }
                startCountdown(key, expireAt);
                openDashboard();
            }
        });
    }

    let timer = null;
    function startCountdown(key, expireAt) {
        function update() {
            const rem = expireAt - Date.now();
            if(rem <= 0) {
                clearInterval(timer);
                db.ref('keys/' + key).remove();
                showModal("EXPIRED", "Session expired!");
                setTimeout(() => window.location.reload(), 1500);
                return;
            }
            const h = Math.floor(rem / 3600000);
            const m = Math.floor((rem % 3600000) / 60000);
            const s = Math.floor((rem % 60000) / 1000);
            document.getElementById('expiryLabel').innerText = `Key expires: ${h}h ${m}m ${s}s`;
        }
        update();
        timer = setInterval(update, 1000);
    }

    function openDashboard(txt) {
        const loginCard = document.getElementById('loginCard');
        loginCard.classList.add('hide-anim');
        setTimeout(() => {
            loginCard.style.display = 'none';
            document.getElementById('dashContainer').style.display = 'flex';
            if(txt) document.getElementById('expiryLabel').innerText = txt;
        }, 380);
    }

    let isActivated = false;
    function toggleActivation() {
        isActivated = !isActivated;
        const btn = document.getElementById("mainBtn");
        const label = document.getElementById("actionText");

        btn.classList.toggle("active", isActivated);
        label.classList.toggle("active", isActivated);

        if(isActivated) {
            label.innerText = "ACTIVATED (TAP TO STOP)";

            // স্কেচওয়্যারের মোর-ব্লক BALAMODE কল
            if(window.Android && window.Android.triggerBalaMode) {
                window.Android.triggerBalaMode("ON");
            }

            if(targetActionUrl) {
                if(window.Android && window.Android.openTargetLink) {
                    window.Android.openTargetLink(targetActionUrl);
                } else {
                    window.open(targetActionUrl, "_blank");
                }
            }
        } else {
            label.innerText = "TAP TO ACTIVATE";
            if(window.Android && window.Android.triggerBalaMode) {
                window.Android.triggerBalaMode("OFF");
            }
        }
    }
</script>
</body>
</html>
